type: array
description: 'Array of account users'
items:
  type: object
  properties:
    account_id:
      type: integer
      description: The ID of the account
    user_id:
      type: integer
      description: The ID of the user
    role:
      type: string
      enum: ['administrator', 'agent', 'supervisor']
      description: whether user is an administrator, supervisor or agent
